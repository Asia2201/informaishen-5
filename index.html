<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інформаційні процеси. Файли та папки — 5 клас</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-gradient-to-r from-sky-500 via-teal-500 to-indigo-500 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-laptop-code text-3xl animate-bounce"></i>
                <div>
                    <h1 class="font-bold text-xl md:text-2xl leading-tight">Інформаційні процеси. Файли та папки</h1>
                    <p class="text-xs text-sky-100 font-light">Інтерактивна практична пригода • 5 клас НУШ</p>
                </div>
            </div>
            <div id="user-badge" class="hidden flex items-center gap-4 bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/30">
                <div class="text-right text-xs">
                    <p id="student-name-display" class="font-bold text-sm"></p>
                    <p id="student-class-display" class="text-sky-100"></p>
                </div>
                <div class="bg-amber-400 text-slate-900 font-extrabold px-3 py-1 rounded-xl text-sm flex items-center gap-1 shadow">
                    <i class="fa-solid fa-star text-amber-600"></i>
                    <span id="score-display">0</span> / 12 балів
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">
        <!-- Main content dynamically rendered via JS -->
        <div id="app-container" class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border border-slate-100 transition-all duration-300"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-100 border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        <p>© 2026 Навчальний інтерактивний вебзастосунок з інформатики для 5 класу НУШ.</p>
    </footer>

    <script src="js/questions.js"></script>
    <script src="js/file-manager.js"></script>
    <script src="js/drag-drop.js"></script>
    <script src="js/report.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
